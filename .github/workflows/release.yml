name: Build & Release Multi-Platform Worm (macOS & Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # Job 1: Build Native macOS Universal App & DMG
  # ==========================================
  build-macos:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build macOS Application & DMG
        run: |
          chmod +x ./scripts/build-app.sh ./scripts/create-dmg.sh
          ./scripts/build-app.sh
          ./scripts/create-dmg.sh
          cd dist
          zip -r -X Worm-macOS.zip Worm.app
          mkdir -p staged
          cp Worm-Installer.dmg staged/
          cp Worm-macOS.zip staged/

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: worm-macos
          path: dist/staged/*

  # ==========================================
  # Job 2: Build Native Windows Single-File Executable
  # ==========================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore worm-windows/Worm.sln

      - name: Publish Self-Contained Worm.exe (x64)
        run: |
          dotnet publish worm-windows/src/WormUI/WormUI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o worm-windows/dist/win-x64
          New-Item -ItemType Directory -Force -Path worm-windows/dist/staged
          Copy-Item worm-windows/dist/win-x64/Worm.exe -Destination worm-windows/dist/staged/Worm.exe
          Compress-Archive -Path worm-windows/dist/win-x64/Worm.exe -DestinationPath worm-windows/dist/staged/Worm-Windows-x64.zip

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: worm-windows
          path: worm-windows/dist/staged/*

  # ==========================================
  # Job 3: Automated Multi-Platform GitHub Release
  # Runs if at least one build succeeded (result != 'skipped')
  # ==========================================
  release:
    needs: [build-macos, build-windows]
    if: |
      always() &&
      startsWith(github.ref, 'refs/tags/') &&
      (needs.build-macos.result == 'success' || needs.build-windows.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS Artifacts
        if: needs.build-macos.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: worm-macos
          path: artifacts/macos

      - name: Download Windows Artifacts
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: worm-windows
          path: artifacts/windows

      - name: List available artifacts
        run: find artifacts -type f 2>/dev/null || echo "No artifacts downloaded"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/macos/Worm-Installer.dmg
            artifacts/macos/Worm-macOS.zip
            artifacts/windows/Worm.exe
            artifacts/windows/Worm-Windows-x64.zip
          fail_on_unmatched_files: false
          generate_release_notes: true
