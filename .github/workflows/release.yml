name: Build & Release Multi-Platform Worm (macOS & Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # Job 1: Build Native macOS Universal App & DMG
  # ==========================================
  build-macos:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build macOS Application & DMG
        run: |
          chmod +x ./scripts/build-app.sh ./scripts/create-dmg.sh
          ./scripts/build-app.sh
          ./scripts/create-dmg.sh
          cd dist
          zip -r -X Worm-macOS.zip Worm.app
          mkdir -p staged
          cp Worm-Installer.dmg staged/
          cp Worm-macOS.zip staged/

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: worm-macos
          path: dist/staged/*

  # ==========================================
  # Job 2: Build Native Windows Single-File Executable
  # ==========================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore worm-windows/Worm.sln

      # Self-contained FOLDER build on purpose.
      # PublishSingleFile + EnableCompressionInSingleFile is what broke v1.0.2:
      # WPF BAML/.g.resources cannot be reliably read from a compressed bundle,
      # so the app crashed before drawing a window.
      - name: Publish self-contained Worm (x64 folder)
        run: >
          dotnet publish worm-windows/src/WormUI/WormUI.csproj
          -c Release -r win-x64 --self-contained true
          -o worm-windows/dist/win-x64

      - name: Package ZIP, install scripts and checksums
        shell: pwsh
        run: |
          & worm-windows/scripts/package.ps1 `
            -PublishDir worm-windows/dist/win-x64 `
            -OutDir worm-windows/dist/staged

      - name: Smoke test the published app
        shell: pwsh
        run: |
          $exe = 'worm-windows/dist/win-x64/Worm.exe'
          if (-not (Test-Path $exe)) { throw "Worm.exe was not produced" }

          $zipPath = 'worm-windows/dist/staged/Worm-Windows-x64.zip'
          if (-not (Test-Path $zipPath)) { throw "ZIP was not produced" }
          if (-not (Test-Path 'worm-windows/dist/staged/SHA256SUMS.txt')) { throw "release checksums were not produced" }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zipPath))
          try {
            $names = $zip.Entries.FullName
            $required = @(
              'Worm.exe','Worm.dll','WormCore.dll','ModernWpf.dll',
              'SHA256SUMS.txt','Install.cmd','Install-Worm.ps1',
              'Uninstall.cmd','Uninstall-Worm.ps1'
            )
            foreach ($r in $required) {
              if ($names -notcontains $r) { throw "ZIP is missing $r" }
            }

            # The installer verifies Worm.exe against the in-ZIP manifest, so the
            # manifest must actually exist inside the archive.
            $entry = $zip.GetEntry('SHA256SUMS.txt')
            $reader = New-Object System.IO.StreamReader($entry.Open())
            try { $manifest = $reader.ReadToEnd() } finally { $reader.Dispose() }
            if ($manifest -notmatch '^[0-9a-f]{64}\s+Worm\.exe') {
              throw "in-ZIP SHA256SUMS.txt has no Worm.exe entry"
            }
            Write-Host "ZIP: $($names.Count) entries; all required files and manifest present."
          } finally { $zip.Dispose() }

          $zipLen = (Get-Item $zipPath).Length
          Write-Host ("ZIP size: {0} MB" -f [math]::Round($zipLen / 1MB, 1))

      - name: Validate installer scripts parse
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem worm-windows/scripts -Filter *.ps1 | ForEach-Object {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs)
            if ($errs -and $errs.Count) {
              $failed = $true
              Write-Host "FAIL $($_.Name)"
              $errs | ForEach-Object { Write-Host "  line $($_.Extent.StartLineNumber): $($_.Message)" }
            } else { Write-Host "OK   $($_.Name)" }
          }
          if ($failed) { throw "PowerShell syntax errors found" }

      - name: Validate Scoop manifest
        shell: pwsh
        run: |
          $m = Get-Content worm-windows/packaging/scoop/worm.json -Raw | ConvertFrom-Json
          if (-not $m.version)    { throw "manifest has no version" }
          if (-not $m.architecture.'64bit'.url) { throw "manifest has no x64 url" }
          if ($m.bin -notcontains 'Worm.exe') { throw "manifest bin must be Worm.exe" }
          Write-Host "Scoop manifest OK (version $($m.version))"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: worm-windows
          path: worm-windows/dist/staged/*

  # ==========================================
  # Job 3: Automated Multi-Platform GitHub Release
  # Runs if at least one build succeeded (result != 'skipped')
  # ==========================================
  release:
    needs: [build-macos, build-windows]
    if: |
      always() &&
      startsWith(github.ref, 'refs/tags/') &&
      (needs.build-macos.result == 'success' || needs.build-windows.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS Artifacts
        if: needs.build-macos.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: worm-macos
          path: artifacts/macos

      - name: Download Windows Artifacts
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: worm-windows
          path: artifacts/windows

      - name: List available artifacts
        run: find artifacts -type f 2>/dev/null || echo "No artifacts downloaded"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/macos/Worm-Installer.dmg
            artifacts/macos/Worm-macOS.zip
            artifacts/windows/Worm-Windows-x64.zip
            artifacts/windows/SHA256SUMS.txt
          fail_on_unmatched_files: false
          generate_release_notes: true
