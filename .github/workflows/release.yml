name: Build & Release Multi-Platform Worm (macOS & Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # Job 1: Build Native macOS Universal App & DMG
  # ==========================================
  build-macos:
    # macos-14 pinned the runner to the macOS 14 SDK, which no longer compiles
    # this Swift 6 package. Use the newest hosted image instead.
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed so `git describe` can see release tags

      - name: Build macOS Application & DMG
        env:
          # Stamp the bundle with the release version rather than a literal.
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          set -o pipefail
          {
            if [ -z "$VERSION" ]; then
              VERSION="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || true)"
            fi
            if [ -z "$VERSION" ]; then VERSION="1.0.3"; fi
            echo "Building Worm.app version $VERSION"
            echo "swift: $(swift --version 2>&1 | head -1)"
            echo "xcode: $(xcodebuild -version 2>&1 | head -1)"
            echo "macos: $(sw_vers -productVersion)"
            chmod +x ./scripts/build-app.sh ./scripts/create-dmg.sh
            ./scripts/build-app.sh
            ./scripts/create-dmg.sh
            cd dist
            zip -r -X Worm-macOS.zip Worm.app
            mkdir -p staged
            cp Worm-Installer.dmg staged/
            cp Worm-macOS.zip staged/
          } 2>&1 | tee build-macos.log

      # Keeps a failing macOS build diagnosable. Artifact downloads need admin
      # rights, but ::error:: annotations are readable from the public check-runs
      # API, so the tail of the log is republished where tooling can see it.
      - name: Upload macOS build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worm-macos-log
          path: build-macos.log
          if-no-files-found: ignore

      - name: Report macOS build failure
        if: failure()
        run: |
          {
            echo "### macOS build log (tail)"
            echo '```'
            tail -50 build-macos.log 2>/dev/null || echo '(no build log produced)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=macOS build failed::$(tail -1 build-macos.log 2>/dev/null | tr -d '\r' | cut -c1-240)"

      - name: Verify macOS bundle
        run: |
          set -euo pipefail
          test -f dist/staged/Worm-Installer.dmg
          test -f dist/staged/Worm-macOS.zip
          # The bundle version must match the release, not a stale literal.
          got=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
                dist/Worm.app/Contents/Info.plist)
          echo "bundle CFBundleShortVersionString=$got"
          if [ "$got" != "$VERSION" ]; then
            echo "::error::bundle version $got does not match release version $VERSION"
            exit 1
          fi
          codesign --verify --verbose=1 dist/Worm.app

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: worm-macos
          path: dist/staged/*

  # ==========================================
  # Job 2: Build Native Windows Single-File Executable
  # ==========================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore worm-windows/Worm.sln

      # Self-contained FOLDER build on purpose.
      # PublishSingleFile + EnableCompressionInSingleFile is what broke v1.0.2:
      # WPF BAML/.g.resources cannot be reliably read from a compressed bundle,
      # so the app crashed before drawing a window.
      - name: Publish self-contained Worm (x64 folder)
        run: >
          dotnet publish worm-windows/src/WormUI/WormUI.csproj
          -c Release -r win-x64 --self-contained true
          -o worm-windows/dist/win-x64

      - name: Package ZIP, install scripts and checksums
        shell: pwsh
        run: |
          & worm-windows/scripts/package.ps1 `
            -PublishDir worm-windows/dist/win-x64 `
            -OutDir worm-windows/dist/staged

      - name: Smoke test the published app
        shell: pwsh
        run: |
          $exe = 'worm-windows/dist/win-x64/Worm.exe'
          if (-not (Test-Path $exe)) { throw "Worm.exe was not produced" }

          $zipPath = 'worm-windows/dist/staged/Worm-Windows-x64.zip'
          if (-not (Test-Path $zipPath)) { throw "ZIP was not produced" }
          if (-not (Test-Path 'worm-windows/dist/staged/SHA256SUMS.txt')) { throw "release checksums were not produced" }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zipPath))
          try {
            $names = $zip.Entries.FullName
            $required = @(
              'Worm.exe','Worm.dll','WormCore.dll','ModernWpf.dll',
              'SHA256SUMS.txt','Install.cmd','Install-Worm.ps1',
              'Uninstall.cmd','Uninstall-Worm.ps1'
            )
            foreach ($r in $required) {
              if ($names -notcontains $r) { throw "ZIP is missing $r" }
            }

            # The installer verifies Worm.exe against the in-ZIP manifest, so the
            # manifest must actually exist inside the archive.
            $entry = $zip.GetEntry('SHA256SUMS.txt')
            $reader = New-Object System.IO.StreamReader($entry.Open())
            try { $manifest = $reader.ReadToEnd() } finally { $reader.Dispose() }
            if ($manifest -notmatch '^[0-9a-f]{64}\s+Worm\.exe') {
              throw "in-ZIP SHA256SUMS.txt has no Worm.exe entry"
            }
            Write-Host "ZIP: $($names.Count) entries; all required files and manifest present."
          } finally { $zip.Dispose() }

          $zipLen = (Get-Item $zipPath).Length
          Write-Host ("ZIP size: {0} MB" -f [math]::Round($zipLen / 1MB, 1))

      # The catalog's allowlist and safety invariants are the things that must
      # never silently drift, so they run before anything is packaged.
      - name: Run WormCore safety tests
        shell: pwsh
        run: dotnet test worm-windows/tests/WormCore.Tests/WormCore.Tests.csproj -c Release --nologo

      - name: Validate installer scripts parse
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem worm-windows/scripts -Filter *.ps1 | ForEach-Object {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs)
            if ($errs -and $errs.Count) {
              $failed = $true
              Write-Host "FAIL $($_.Name)"
              $errs | ForEach-Object { Write-Host "  line $($_.Extent.StartLineNumber): $($_.Message)" }
            } else { Write-Host "OK   $($_.Name)" }
          }
          if ($failed) { throw "PowerShell syntax errors found" }

      - name: Validate Scoop manifest
        shell: pwsh
        run: |
          $m = Get-Content worm-windows/packaging/scoop/worm.json -Raw | ConvertFrom-Json
          if (-not $m.version)    { throw "manifest has no version" }
          if (-not $m.architecture.'64bit'.url) { throw "manifest has no x64 url" }
          if ($m.bin -notcontains 'Worm.exe') { throw "manifest bin must be Worm.exe" }
          Write-Host "Scoop manifest OK (version $($m.version))"

      # v1.0.2 and v1.0.3 both compiled cleanly and then died the instant the
      # window was created: XAML compiles to BAML, so a bad type converter or a
      # missing icon only fails at runtime. This step actually launches the exe
      # and fails on any crash, which is the only check that catches that class
      # of bug before it ships.
      - name: Launch smoke test
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'worm-windows/dist/win-x64/Worm.exe').Path
          $logDir = Join-Path $env:LOCALAPPDATA 'Worm\Logs'
          $crash  = Join-Path $logDir 'crash.log'
          $start  = Join-Path $logDir 'startup.log'
          Remove-Item $crash, $start -ErrorAction SilentlyContinue

          $p = Start-Process -FilePath $exe -PassThru -ErrorAction Stop
          Start-Sleep -Seconds 15
          $alive = -not $p.HasExited
          if ($alive) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }

          if (Test-Path $crash) {
            Write-Host '::group::Worm crash.log'
            Get-Content $crash
            Write-Host '::endgroup::'
            throw "Worm.exe logged a startup crash - see crash.log above"
          }

          if (-not (Test-Path $start)) {
            throw "startup.log was never written, so App.OnStartup did not complete"
          }

          if ($alive) {
            Write-Host "Worm.exe ran for 15s with no crash log. Startup is healthy."
          } else {
            # No crash log and no startup log: most likely the runner has no
            # interactive window station. Warn rather than fail, so a headless
            # runner does not block releases, but keep it visible.
            Write-Warning "Worm.exe exited without crashing and without logging; the runner may lack an interactive desktop."
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: worm-windows
          path: worm-windows/dist/staged/*

  # ==========================================
  # Job 3: Automated Multi-Platform GitHub Release
  # Runs if at least one build succeeded (result != 'skipped')
  # ==========================================
  release:
    needs: [build-macos, build-windows]
    if: |
      always() &&
      startsWith(github.ref, 'refs/tags/') &&
      (needs.build-macos.result == 'success' || needs.build-windows.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS Artifacts
        if: needs.build-macos.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: worm-macos
          path: artifacts/macos

      - name: Download Windows Artifacts
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: worm-windows
          path: artifacts/windows

      - name: List available artifacts
        run: find artifacts -type f 2>/dev/null || echo "No artifacts downloaded"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/macos/Worm-Installer.dmg
            artifacts/macos/Worm-macOS.zip
            artifacts/windows/Worm-Windows-x64.zip
            artifacts/windows/SHA256SUMS.txt
          fail_on_unmatched_files: false
          generate_release_notes: true
