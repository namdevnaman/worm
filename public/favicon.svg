<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Worm Cleaner">
  <defs>
    <linearGradient id="soil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#231c18"/>
      <stop offset="1" stop-color="#0c0a08"/>
    </linearGradient>
    <linearGradient id="flesh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc9bb"/>
      <stop offset="0.55" stop-color="#e07a5f"/>
      <stop offset="1" stop-color="#a34531"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#soil)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="#f4978e" stroke-opacity="0.4"/>

  <!-- Segmented body, tapering tail-first, matching the hero's worm. -->
  <g fill="url(#flesh)">
    <circle cx="19" cy="42" r="4.1"/>
    <circle cx="26" cy="38" r="4.6"/>
    <circle cx="33.5" cy="34" r="5.1"/>
    <circle cx="41" cy="30" r="5.6"/>
  </g>
  <circle cx="48" cy="25" r="6.4" fill="#ffc9bb"/>
  <circle cx="46.2" cy="23.2" r="1.5" fill="#2a1512"/>
</svg>